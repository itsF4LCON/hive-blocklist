name: weekly

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build.py
        env:
          HIVE_EXPORT_TOKEN: ${{ secrets.HIVE_EXPORT_TOKEN }}
      - run: |
          git add lists reports archive
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly update: $(python3 -c 'import json; print(json.load(open("reports/index.json"))[0]["title"])')"
          git push
